<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Recadinho · Fabio & Cleber 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <script>
    // Cache-buster: GitHub Pages caches assets, so we load CSS/JS with a
    // changing version query to make sure the latest code always wins.
    window.__ASSET_VERSION__ = Date.now();
    (function () {
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "style.css?v=" + window.__ASSET_VERSION__;
      document.head.appendChild(css);
    })();
  </script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="app">
    <nav class="nav">
      <a href="index.html" class="nav-link">🏠 Dashboard</a>
      <a href="sorteio.html" class="nav-link">🎲 Sorteio</a>
      <a href="recadinho.html" class="nav-link active">💌 Recadinho</a>
    </nav>

    <header class="header">
      <h1 class="title">Recadinho <span class="accent">pro Fabio</span> 💌</h1>
      <p class="subtitle">Um toque e cai direto no celular dele</p>
    </header>

    <section class="notify-panel" id="notify"></section>

    <footer class="footer">
      <p>Feito com 💚 para o Fabio e o Cleber.</p>
    </footer>
  </main>

  <script>
    // Load scripts in order (config first) with the same cache-buster.
    (function () {
      var v = window.__ASSET_VERSION__;
      var scripts = ["config.js", "notify.js"];
      (function load(i) {
        if (i >= scripts.length) return;
        var s = document.createElement("script");
        s.src = scripts[i] + "?v=" + v;
        s.onload = function () { load(i + 1); };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
