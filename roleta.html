<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Roleta · Fabio & Cleber 🎡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <script>
    // Cache-buster: GitHub Pages caches assets, so we load CSS/JS with a
    // changing version query to make sure the latest code always wins.
    window.__ASSET_VERSION__ = Date.now();
    (function () {
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "style.css?v=" + window.__ASSET_VERSION__;
      document.head.appendChild(css);
    })();
  </script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="app">
    <nav class="nav">
      <a href="index.html" class="nav-link">🏠 Dashboard</a>
      <a href="sorteio.html" class="nav-link">🎲 Sorteio</a>
      <a href="roleta.html" class="nav-link active">🎡 Roleta</a>
      <a href="recadinho.html" class="nav-link">🐦‍⬛ Corvo</a>
    </nav>

    <header class="header">
      <h1 class="title">A Roleta <span class="accent">Secreta</span> 🎡</h1>
      <p class="subtitle">Ninguém sabe o que vem... gira e descobre 👀</p>
    </header>

    <section class="roulette-panel">
      <div class="roulette-stage">
        <div class="roulette-pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="340" height="340"></canvas>
      </div>
      <button class="btn btn-primary" id="spin">Girar 🎡</button>
      <div class="roulette-result" id="roulette-result">Gira pra ver!</div>
      <div class="roulette-spins" id="roulette-spins"></div>
    </section>

    <footer class="footer">
      <p>Feito com 💚 para o Fabio e o Cleber.</p>
    </footer>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script>
    // Load scripts in order (config first) with the same cache-buster.
    (function () {
      var v = window.__ASSET_VERSION__;
      var scripts = ["config.js", "roleta.js"];
      (function load(i) {
        if (i >= scripts.length) return;
        var s = document.createElement("script");
        s.src = scripts[i] + "?v=" + v;
        s.onload = function () { load(i + 1); };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
